<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maihar Construction — Login</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh}
  .card{background:#1e293b;padding:24px;border-radius:12px;width:min(92vw,380px)}
  input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #475569;font-size:16px;box-sizing:border-box}
  input{background:#0f172a;color:#e2e8f0} button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  button:disabled{background:#475569;cursor:not-allowed} #msg{color:#fca5a5;min-height:1.4em}
</style>
</head>
<body>
<div class="card">
  <h2>Maihar Construction</h2>
  <div id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go" type="button">Login</button>
  </div>
  <div id="projects" hidden></div>
  <p id="msg"></p>
</div>
<script type="module">
import { firebaseConfig, isConfigured } from './firebase-config.js';
import { createAuthFlow } from './login.js';
import { PROJECTS } from './project-registry.js';
import { renderProjects } from './project-selector.js';
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t; };
const REASONS = { 'missing-input':'Enter your email and password.', 'bad-credentials':'Email or password is incorrect.',
  'no-access':'You do not have access to any project. Please contact the admin.' };

if (!isConfigured) {
  msg('Firebase config is not set yet (shell/firebase-config.js).');
  $('go').disabled = true;
} else {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getAuth, signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
  const flow = createAuthFlow({
    registry: PROJECTS,
    signIn: (e, p) => signInWithEmailAndPassword(auth, e, p),
    fetchRoleDoc: async e => { const s = await getDoc(doc(db, 'userRoles', e)); return s.exists() ? s.data() : null; },
  });
  let session = null;
  const run = async () => {
    msg('');
    const r = await flow.login($('email').value, $('pw').value);
    if (!r.ok) return msg(REASONS[r.reason] || 'Login failed.');
    session = r; $('login').hidden = true; $('projects').hidden = false;
    renderProjects($('projects'), r.projects, id => {
      const s = flow.selectProject(session, id);
      if (s.ok) location.href = '../projects/' + id + '/index.html';
    });
  };
  $('go').addEventListener('click', run);
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') $('pw').focus(); });
}
</script>
</body>
</html>
